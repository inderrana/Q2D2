<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Q2D2">
  <!-- Open ring: a single arc in a coral→violet gradient with a clean
       gap in the upper-right. A lime dot floats in the gap — the
       missing piece, the cursor about to close the loop. The gap
       is the signature gesture. -->
  <defs>
    <linearGradient id="pop" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4f46e5"/>
      <stop offset="55%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Arc: ~305° of a circle r=22 around (32,32). Moderate gap in the
       upper-right — enough room for the dot to read as floating. -->
  <path d="M 52.34 23.13 A 22 22 0 1 1 38.85 11.18"
        fill="none" stroke="url(#pop)" stroke-width="6" stroke-linecap="round"/>
  <!-- Lime dot, centered in the gap. -->
  <circle cx="46.47" cy="16.05" r="2.6" fill="#facc15"/>
</svg>
